{% extends "base.html" %}

{% block title %}Login - Virtual Color Win{% endblock %}

{% block content %}
<div class="p-6 flex-1 flex flex-col justify-between">
  <!-- Top Branding -->
  <div class="text-center pt-8">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-3xl shadow-lg shadow-indigo-500/30 mb-3">
      🎯
    </div>
    <h2 class="text-2xl font-black text-white tracking-wide">Welcome Back</h2>
    <p class="text-xs text-slate-400 mt-1">Log in to your Virtual Simulation Account</p>
  </div>

  <!-- Login Form -->
  <form method="POST" action="{{ url_for('login') }}" class="space-y-4 my-auto">
    <!-- Phone -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Mobile Phone Number</label>
      <div class="flex bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-indigo-500 transition">
        <span class="px-3 py-2.5 bg-slate-800 text-xs font-bold text-slate-400 border-r border-slate-700 flex items-center">+91</span>
        <input type="tel" name="phone" required placeholder="Enter mobile number" class="w-full bg-transparent px-3 py-2.5 text-sm text-white placeholder-slate-500 outline-none">
      </div>
    </div>

    <!-- Password -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
      <input type="password" name="password" required placeholder="Enter your password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
    </div>

    <!-- Submit Button -->
    <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-500/25 active:scale-95 transition mt-2">
      Log In
    </button>
  </form>

  <!-- Bottom Link -->
  <div class="text-center text-xs text-slate-400 pb-4">
    Don't have an account? 
    <a href="{{ url_for('register') }}" class="text-indigo-400 font-bold hover:underline">Register now</a>
  </div>
</div>
{% endblock %}
