{% extends "base.html" %}

{% block title %}Register - Virtual Color Win{% endblock %}

{% block content %}
<div class="p-6 flex-1 flex flex-col justify-between">
  <!-- Top Branding -->
  <div class="text-center pt-4">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-3xl shadow-lg shadow-indigo-500/30 mb-3">
      🎯
    </div>
    <h2 class="text-2xl font-black text-white tracking-wide">Create Account</h2>
    <p class="text-xs text-slate-400 mt-1">Sign up & get 1,000 Free Virtual Coins</p>
  </div>

  <!-- Registration Form -->
  <form method="POST" action="{{ url_for('register') }}" class="space-y-4 my-auto">
    <!-- Phone -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Mobile Phone Number</label>
      <div class="flex bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-indigo-500 transition">
        <span class="px-3 py-2.5 bg-slate-800 text-xs font-bold text-slate-400 border-r border-slate-700 flex items-center">+91</span>
        <input type="tel" name="phone" required placeholder="Enter 10-digit number" class="w-full bg-transparent px-3 py-2.5 text-sm text-white placeholder-slate-500 outline-none">
      </div>
    </div>

    <!-- Password -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Set Password</label>
      <input type="password" name="password" required placeholder="Minimum 6 characters" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
    </div>

    <!-- Confirm Password -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Confirm Password</label>
      <input type="password" name="confirm_password" required placeholder="Re-enter password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
    </div>

    <!-- Invitation Code -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1 flex justify-between">
        <span>Invitation Code</span>
        <span class="text-[10px] text-indigo-400 font-normal">Optional / Auto-filled</span>
      </label>
      <input type="text" id="invitation_code" name="invitation_code" value="{{ invitation_code or '' }}" placeholder="Enter referral code" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-amber-300 font-mono tracking-wider outline-none focus:border-indigo-500 transition">
    </div>

    <!-- Agreement -->
    <div class="flex items-center text-xs text-slate-400 pt-1">
      <input type="checkbox" id="agree" required checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-500 focus:ring-0 mr-2">
      <label for="agree">I agree to the <span class="text-indigo-400">Virtual Simulation Rules</span></label>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-500/25 active:scale-95 transition">
      Register & Claim 1,000 Coins
    </button>
  </form>

  <!-- Bottom Link -->
  <div class="text-center text-xs text-slate-400 pb-2">
    Already registered? 
    <a href="{{ url_for('login') }}" class="text-indigo-400 font-bold hover:underline">Log in here</a>
  </div>
</div>

<script>
  // Also check hash/query params dynamically if passed via client side #/register?invitationCode=...
  window.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('invitation_code');
    if (!input.value) {
      // Check query string
      const urlParams = new URLSearchParams(window.location.search);
      let code = urlParams.get('invitationCode') || urlParams.get('code');
      
      // Also check hash like #/register?invitationCode=...
      if (!code && window.location.hash.includes('invitationCode=')) {
        const hashQuery = window.location.hash.split('?')[1];
        if (hashQuery) {
          const hashParams = new URLSearchParams(hashQuery);
          code = hashParams.get('invitationCode');
        }
      }
      if (code) {
        input.value = code;
      }
    }
  });
</script>
{% endblock %}
